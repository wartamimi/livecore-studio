# XcodeGen spec — generates LiveCoreStudio.xcodeproj (macOS app bundle with Info.plist,
# entitlements, hardened runtime and code signing). Run: xcodegen generate
name: LiveCoreStudio
options:
  bundleIdPrefix: studio.livecore
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"          # arm64 + x86_64 (Universal) for Release
    ONLY_ACTIVE_ARCH[config=Debug]: YES
packages:
  LiveCoreStudio:
    path: .
targets:
  LiveCoreStudio:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: LiveCoreStudio
        product: LiveCoreUI
      # LiveCore Virtual Camera, embedded in Contents/Library/SystemExtensions. macOS only
      # activates it once the app is signed with a Developer ID (docs/VIRTUAL_CAMERA.md).
      - target: LiveCoreCameraExtension
        embed: true
        codeSign: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: LiveCore Studio
        CFBundleDisplayName: LiveCore Studio
        CFBundleShortVersionString: "0.22.0"
        CFBundleVersion: "27"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, id]
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "13.0"
        NSCameraUsageDescription: LiveCore Studio uses cameras and video capture devices as production inputs.
        NSMicrophoneUsageDescription: LiveCore Studio uses microphones and audio interfaces as mixer inputs.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: false
    entitlements:
      path: Config/LiveCoreStudio.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.livecore.LiveCoreStudio
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"          # ad-hoc by default; set your Developer ID for distribution
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  LiveCoreCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension
        excludes: [Info.plist, CameraExtension.entitlements]
      - path: Sources/LiveCoreCore/Model/VirtualCameraIdentity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.livecore.LiveCoreStudio.CameraExtension
        PRODUCT_NAME: studio.livecore.LiveCoreStudio.CameraExtension
        INFOPLIST_FILE: CameraExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
schemes:
  LiveCoreStudio:
    build:
      targets:
        LiveCoreStudio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LiveCoreStudio/LiveCoreCoreTests
    archive:
      config: Release
