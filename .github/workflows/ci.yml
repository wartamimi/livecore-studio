name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # Foundation-free core logic and protocol tests on Linux (fast, about 2 min). It does not block the
  # DMG: the macos-app job builds and publishes it on its own.
  linux-core:
    # A pull request from a branch of this repository already runs on push; skip the duplicate run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.0" }
      # Ubuntu mirrors occasionally stall; bound each attempt and retry instead of eating the job timeout.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && timeout 150 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg && exit 0
            echo "apt attempt $i failed, retrying"; sleep 10
          done
          exit 1
      - run: scripts/ci_run.sh linux-validate scripts/validate_linux.sh
  macos-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ffmpeg
      - run: xcodebuild -version && xcodegen --version
      - run: scripts/ci_run.sh macos-swift-build swift build --build-tests
      - run: scripts/ci_run.sh macos-swift-test swift test
      - run: scripts/ci_run.sh macos-metal-shaders scripts/check_shaders.sh
      - run: scripts/ci_run.sh macos-syphon-check swift run livecore-syphon-check
      - run: scripts/ci_run.sh macos-ndi-runtime scripts/install_ndi_runtime.sh
      - run: scripts/ci_run.sh macos-ndi-check swift run livecore-ndi-check
        env:
          LIVECORE_NDI_REQUIRED: "1"
      - run: scripts/ci_run.sh macos-rtmp-e2e scripts/rtmp_e2e_test.sh
      - run: scripts/ci_run.sh macos-app-build scripts/build_macos.sh release
      - run: scripts/ci_run.sh macos-dmg scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCoreStudio-dmg
          path: build/LiveCoreStudio-0.30.0-unsigned.dmg
      - name: Publish DMG as pre-release (main and claude/* development branches)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAG="build-${GITHUB_RUN_NUMBER}"; else TAG="dev-build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" build/LiveCoreStudio-0.30.0-unsigned.dmg \
            --prerelease --target "$GITHUB_SHA" --title "LiveCore Studio 0.30.0 build ${GITHUB_RUN_NUMBER} (unsigned, ${GITHUB_REF_NAME})" \
            --notes "Automated CI build from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Unsigned and not notarized: right-click the app and choose Open the first time. New features are compiled and unit-tested but need hardware verification; see docs/TEST_PLAN.md (T-61..T-126: scenes, transparency, source viewer, capture settings, audio properties, colour bars, input colour correction, test tone, rotation, ticker, photo slideshow, delay de-click, AFV crossfade, ticker text file, Ken Burns, ticker direction and RSS, overlay animations, key eyedropper, music fades, mixer close and lock, playlist dock, bottom dock, NOT RECORDING reminder, outputs 1-4, Syphon (CI-checked), playlist select, overlay numbers on input tiles, replay under T-bar, NDI output for NDI Virtual Camera (CI-checked), Layer Designer, FULLSCREEN per output display, layer drafts, no duplicate inputs, repeat/shuffle, T-bar, canvas portrait/custom, replay fix, repeat one, capture card advanced settings, NDI inputs (CI-checked), Web Controller (server CI-tested))."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/*.log
