name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # Foundation-free core logic and protocol tests on Linux (fast, about 2 min). It does not block the
  # DMG: the macos-app job builds and publishes it on its own.
  linux-core:
    # A pull request from a branch of this repository already runs on push; skip the duplicate run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Swift from the swift.org tarball: setup-swift's GPG key refresh (keyserver.ubuntu.com) and the
      # swift Docker image's apt (archive.ubuntu.com) both failed on 2026-11-11; the runner's own apt mirror works.
      - name: Install Swift 6.0.3
        run: |
          curl -fsSL --retry 3 https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/swift-6.0.3-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      # Ubuntu mirrors occasionally stall; bound each attempt and retry instead of eating the job timeout.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && timeout 150 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg && exit 0
            echo "apt attempt $i failed, retrying"; sleep 10
          done
          exit 1
      - run: scripts/ci_run.sh linux-validate scripts/validate_linux.sh
  # The DMG is built and published as soon as the app compiles and the unit tests pass (about
  # 5 minutes). The longer engine checks (NDI, ISO, RTMP/SRT end to end, soak) run next to it and
  # report failures as commit comments without holding the DMG back.
  macos-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodebuild -version && xcodegen --version
      - run: scripts/ci_run.sh macos-app-build scripts/build_macos.sh release
        env:
          LIVECORE_SKIP_TESTS: "1"
          LC_SIGN_P12: ${{ secrets.LC_SIGN_P12 }}
          LC_SIGN_P12_PASSWORD: ${{ secrets.LC_SIGN_P12_PASSWORD }}
      - run: scripts/ci_run.sh macos-dmg scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCoreStudio-dmg
          path: build/LiveCoreStudio-0.76.1-unsigned.dmg
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-app
          path: build/*.log
  macos-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg
      - run: scripts/ci_run.sh macos-swift-build swift build --build-tests
      - run: scripts/ci_run.sh macos-swift-test swift test
      - run: scripts/ci_run.sh macos-metal-shaders scripts/check_shaders.sh
      - run: scripts/ci_run.sh macos-title-check swift run livecore-title-check
      - uses: actions/upload-artifact@v4
        with:
          name: title-templates
          path: build/title-templates.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-tests
          path: build/*.log
  macos-engine-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg srt
      - run: scripts/ci_run.sh macos-checks-build swift build
      - run: scripts/ci_run.sh macos-ndi-runtime scripts/install_ndi_runtime.sh
      - run: scripts/ci_run.sh macos-ndi-check swift run livecore-ndi-check
      - run: scripts/ci_run.sh macos-iso-check swift run livecore-iso-check
        env:
          LIVECORE_NDI_REQUIRED: "1"
      - run: scripts/ci_run.sh macos-replay-check swift run livecore-replay-check
        timeout-minutes: 5
      - run: scripts/ci_run.sh macos-plugin-build swift build --product LCTestGainVST3
      - run: scripts/ci_run.sh macos-plugin-check swift run livecore-plugin-check .build/debug/libLCTestGainVST3.dylib
        timeout-minutes: 5
      - run: scripts/ci_run.sh macos-rtmp-e2e scripts/rtmp_e2e_test.sh
      # SRT input decoded end to end. H.264 through srt-live-transmit on the CI VM still shows
      # decode errors (HEVC and file decoding pass; the user confirmed SRT works on a real Mac), so
      # the result is reported without failing the build until that is fixed (user's call, 0.54.0).
      - run: scripts/ci_run.sh macos-srt-input-check swift run livecore-srt-input-check engine
        if: false   # switched off for now at the user's request (2026-11-03); remove this line to run it again
        timeout-minutes: 5
        continue-on-error: true
      # Engine run with recording + streaming, a stream drop in the middle and a full disk.
      # Its disk-full part is known to fail (docs/KNOWN_ISSUES.md); the result is still reported.
      - run: scripts/ci_run.sh macos-soak-check swift run livecore-soak-check
        if: false   # switched off for now at the user's request (2026-11-03); remove this line to run it again
        continue-on-error: true
        env:
          SOAK_SECONDS: "90"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-checks
          path: build/*.log
  publish:
    needs: [macos-app, macos-tests]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { path: build, merge-multiple: true }
      - name: Publish DMG as pre-release (main and claude/* development branches)
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAG="build-${GITHUB_RUN_NUMBER}"; else TAG="dev-build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" build/LiveCoreStudio-0.76.1-unsigned.dmg build/title-templates.png --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "LiveCore Studio 0.76.1 build ${GITHUB_RUN_NUMBER} (unsigned, ${GITHUB_REF_NAME})" \
            --notes "Automated CI build from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Unsigned and not notarized: right-click the app and choose Open the first time. 0.76.1: system controls, pop-up menus and sheets always dark (no white pickers in Outputs or Settings); Tailscale removed from Web Controller online access (Cloudflare only); LCS Live guest page redesigned in Studio Black (logo header, LIVE pill and red frame while connected, cards, orange Join, red Hang up, phone layout); Screen Recording permission asked once per launch with an Ask again button. 0.76.0: Studio Black design: the default theme is now near-black with neutral grey panels, a LiveCore orange accent and clearer text, Preview / Program headers with a tally dot and rounded tally frames (the previous blue-grey look stays as the Slate theme in Settings › Appearance); add-input dialogs show the input's icon next to the title; streaming service row with icons and a prominent Log in button; Properties preview framed like the tiles; leftover system grey colours replaced by theme colours. 0.75.0: show graphics: logo bug (Add Input › Logo bug: one or more logos small in a corner on overlay 4, several take turns), scoreboard (Show Automation: teams, score and period written into a title input, +/- buttons in the app and on the Web Controller), end credits (running text direction Bottom → top and the End credits template), automatic speaker name tags (camera on Program shows that speaker's name and role on a lower-third overlay for a few seconds). 0.73.2: input tiles redrawn (rounded picture, tally-coloured number badge, hover actions on a dark strip at the bottom, roomier name row); input Properties with a title bar that shows the input type and its Preview / Program state and the same side list as Settings; every dialog (input settings, add-input windows, Settings, Outputs, Templates, audio windows) now opens on the theme background with the accent colour, from one shared dialog style. 0.73.1: flat design again (the glass look of 0.73.0 is removed), tidied: one corner radius and border for panels, tiles, mixer strips and buttons, clearer hover / pressed / active button states, Settings with a side list and content as panels, tool windows on the theme background; responsive docks: narrow windows (under about 1060 pt) get slimmer Inputs and Playlist docks and tighter spacing so the monitors keep the room, wide screens (from about 1600 pt) get a wider Inputs dock. 0.72.2: animated LiveCore logo when the app opens (about 4 s; skip with a click or key, turn off in Settings › Appearance, still with Reduce Motion); one interface again, the same as 0.71.0 (the Studio interface of 0.72.0 / 0.72.1 is removed). 0.71.0: backup stream server per destination (automatic failover), safe slate when the Program camera loses its signal, auto-director (camera follows the microphone that talks), macros run other macros, fade faders, have step conditions and time-of-day triggers, Teleprompter window and on the Web Controller, AI summary / minutes / YouTube chapters from the transcript, multitrack audio recording (one WAV per mixer channel). 0.70.3: AI Assistant uses far fewer tokens: the show goes as short text only with the newest command, finished commands are kept as short pairs without tool calls or results (last 6), Anthropic caches the system prompt and tools; tokens per command and the total are shown in the chat. 0.70.2: AI Assistant makes files and designs: save_file (scripts, rundown .csv, subtitles .srt, captions, json, html, svg) to Documents › LiveCore Studio › AI with Show in Finder / Open, create_graphic (its own SVG still or animated HTML graphic added as an image or browser input, optionally on an overlay), save_title_template (title or running-text look to My Templates as .lctitle); longer answers (16k tokens). 0.70.1: AI Assistant provider TokenMurah (tokenmurah.net, OpenAI-compatible gateway paid in rupiah: Claude, GPT, Gemini, DeepSeek, Kimi, GLM; sk-tm- or sk-tp- key, Check models lists the key catalogue). 0.70.0: AI Assistant gets a built-in LiveCore manual for every provider and model (screens, input types, typical shows, what operators mean, which tool does what, producer ideas beyond the app), new get_app_details tool (CPU, RAM, GPU, FPS, drops, record time, file size, free disk, stream bitrate and reconnects, input health); CPU / RAM / FPS and the recording time in the dock update in real time again. 0.69.1: AI Assistant offers 2-4 tap-able ready answers when it asks a question or you seem unsure (built from the inputs in your show), and useful next steps after a command. 0.69.0: AI Assistant answers in plain text (no Markdown marks), Regenerate button for the last command, AI button next to Multiview in the top bar, Exa provider (web answers) and web_search through Exa for every model, app_action tool (next / previous preview, overlay on Preview, replay, T-bar, PTZ, data rows, QR items, slides, full screen, open windows), the show state sent with every command, inputs named by name, forgiving step names, errors list the valid inputs so the model corrects itself, up to 12 rounds. 0.68.2: AI Assistant Models menu asks the provider which models your key can use (Check models for my key; Ollama lists the models pulled on this Mac), checked again after saving a key; new free-tier providers Groq and OpenRouter (own API key, OpenRouter lists its free tool-capable models first). 0.68.1: AI Assistant retries busy or rate-limited providers (HTTP 429/5xx) up to 3 times with back-off and suggests another model if they stay busy. 0.68.0: AI Assistant can read and change every input setting (title design, running text, QR, timer, virtual set, colour correction, chroma key, layers, name), the audio mixer (fader, mute, gain, pan, EQ, compressor, gate, buses), the transition, and remove inputs; new chat-style AI panel (bubbles, suggestion chips, thinking animation, folding settings). 0.67.2: Gemini default model gemini-3.8-flash (2.5 closed to new keys), AI Assistant can add colour bars / colour inputs. 0.67.1: AI Assistant waits up to 120 s, Gemini asked for a quick answer (low reasoning), network errors show the host and error code. 0.67.0: AI Assistant creates content: title / lower-third inputs from templates with its own text, colours and font, new text on titles, running-text inputs, saved macros, and writes scripts / captions in its answer; API key label follows the chosen provider. 0.66.1: AI Assistant providers: Anthropic Claude, OpenAI, Google Gemini and Ollama (local model on this Mac), model typed or picked per provider. 0.66.0: AI Assistant (Production › AI Assistant…, ⌥⌘J): type a command and Claude (Anthropic API, your own key) carries it out with the macro actions; MACROS button removed from the bottom bar (Production › Macros…); Title / Lower Third window no longer cut off on the left; Groq transcription model removed. 0.65.0: Macros & triggers (Production › Macros…: step lists with CUT/AUTO/transition to input, overlays on/off, audio on/off, video play/pause/restart, waits, stream/record; triggers on input to Program/Preview, input leaves Program, video end, stream/record start/stop; run from the window, keyboard shortcuts, MIDI and the Web Controller) and a gain-sharing auto mixer for microphones (Audio Properties › Auto Mix, weight per mic). 0.64.0: .lctitle title template files, My Templates gallery. 0.63.4: 24 and 25 fps always available for camera / capture-card inputs (devices without them run at 48/50 fps or their default rate and the input keeps only the frames needed). 0.63.3: no more bursts of dropped frames every 30 s while recording (the disk-space check no longer blocks the recorder; a slow recording drive drops recording frames instead of Program/stream frames). 0.63.2: Properties window opens at full size (camera Source page no longer cut off on both sides); removing a camera / capture-card input also removes its own audio channel from the mixer and stops that audio capture. 0.63.1: playlist clicks and Preview back to the 0.62.0 behaviour (click selects, double-click plays; no black Preview). 0.63.0: no media controls on input tiles, mixer input strips fold to the side, dock layouts rebuild correctly after minimizing, Appearance first in Settings, File menu in the window and Save Project in the File menu, Program right-click Fullscreen with display choice, 9 more .metal transition examples, 6 Multiview layouts. 0.62.0: new Web Controller (responsive phone/tablet/desktop design, pictures pushed over one stream, adaptive audio jitter buffer without dropouts, PTZ/data/fullscreen/stats, settings and keyboard keys), keyboard shortcut table (empty by default, 5 presets, every switcher action), Syphon and vMix GT inputs removed (old projects: Syphon routing becomes NDI, GT inputs skipped), layer edit: names no longer cover the icons, double-click a layer for options, Properties window adapts to the screen with a new Animation tab (Motion with 12 effects, Mask and Wave, LUT), File menu: Open Recent, Save as Template, New from My Template, Settings › Appearance (7 themes, accent colours, colour-blind safe tally, 6 dock layouts). 0.61.0: closing the main window quits the app and everything stops (media, audio, aux outputs, tunnels; leftover tunnel processes ended at next launch), Play at the end of a clip restarts it, media controller under Preview, image input takes every format macOS can open (HEIC, AVIF, WebP, TIFF, GIF, PSD, RAW, PDF, SVG...), Online Library by Pixabay input (own API key, photos/illustrations/vectors/videos, downloaded once), Tailscale (private Serve or public Funnel) as online method for the Web Controller. 0.60.0: audio plug-ins in the mixer: Audio Unit (AUv2/AUv3, out of process by default) and VST3 effects, up to 8 inserts per channel and on the master bus (FX button), the plug-in's own editor window or generic sliders, bypass, order, saved with the project; VST3 scanned in a separate process, crash guard (a plug-in that closes the app is disabled / restored bypassed). 0.59.0: Preview, Program and output windows (TV/projector) keep moving while windows, sheets or menus open (pictures put on screen off the main thread). 0.58.0: QR code input (link, text, QRIS/payment read from a picture, Wi-Fi, contact, WhatsApp, e-mail, phone; presets, colours, logo, card, position, motion, hide after N s; Web Controller) and highlight video from ★ marks (pre/post-roll, crossfade, 16:9 or 9:16; Production › Highlights…, ★ MARK on the Web Controller, MIDI). 0.57.0: Groq (Whisper large-v3) model for Realtime Transcription, Transcript window to select, copy or save the transcribed text. 0.56.0: Program controller hidden for inputs without media controls, Multiview/Settings as hover buttons, Rundown icon removed (Production menu), Playlist dock only for playlists (opens on Add Media Playlist), stream/record status on one line. 0.55.0: smoother input previews (25–30 fps), small audio meter on input tiles, Add Label… colour labels (grey All), playlist play button follows the input, menus Settings / Multiview Mode / Create Rundown, 9:16 vertical output removed, ADD INPUT in the bottom bar, Rundown as an icon, Transition and Audio Mixer no longer minimize, Add Media takes one file, Program transport controller, input type icons. 0.54.2: Web Controller adapts to weak connections (smaller pictures, lower fps, mono audio, adaptive buffer, request timeouts, auto reconnect, commands re-sent once-only). 0.54.1: Web Controller keep-alive + TCP_NODELAY (smoother pictures and Audio Monitor), unchanged pictures not re-sent. New features are compiled and unit-tested but need hardware verification; see docs/FEATURE_STATUS.md and docs/TEST_PLAN.md (T-61..T-195). 0.54.0: SRT input (listener/caller) and Blackmagic DeckLink / UltraStudio capture input. 0.53.0: performance (pooled frame buffers, one shared Core Image context, lighter LCS Live capture and return feed, streamed Web Audio Monitor). 0.52.0: LCS Live remote guest input (browser link, WebRTC, Program + mix-minus return feed, optional TURN). 0.51.0: one Keychain vault (no repeated password prompts; Settings › Security), Flags of the world input with waving animation, input mask (shape/image), Realtime Transcription advanced settings. 0.49.0: Drop counter ignores the 5 s render warm-up (click to reset), media repeat off by default, PHOTO removed (Program right-click: Screenshot, Grab as Still), OUTPUTS moved to the bottom dock. 0.48.0: Settings as an OBS-style sidebar list. 0.38.0: web edit window fits the page to the window (no zoomed or cropped view, page scrolling works), page screen size = input size for in-page fullscreen, Pre-flight moved to Settings, Operator/Advanced switch removed, smoother title animations while menus are open, 3 GPU frames in flight, main-thread stall and render-drop log, faster CI (DMG job runs in parallel with the engine checks), Online Radio input (free Radio Browser directory, HTTPS MP3/AAC, song titles; CI-checked decoder)."
