name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.0" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: scripts/ci_run.sh linux-validate scripts/validate_linux.sh
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ffmpeg
      - run: xcodebuild -version && xcodegen --version
      - run: scripts/ci_run.sh macos-swift-build swift build --build-tests
      - run: scripts/ci_run.sh macos-swift-test swift test
      - run: scripts/ci_run.sh macos-metal-shaders scripts/check_shaders.sh
      - run: scripts/ci_run.sh macos-rtmp-e2e scripts/rtmp_e2e_test.sh
      - run: scripts/ci_run.sh macos-app-build scripts/build_macos.sh release
      - run: scripts/ci_run.sh macos-dmg scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCoreStudio-dmg
          path: build/LiveCoreStudio-0.7.0-unsigned.dmg
      - name: Publish DMG as pre-release (main and claude/* development branches)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAG="build-${GITHUB_RUN_NUMBER}"; else TAG="dev-build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" build/LiveCoreStudio-0.7.0-unsigned.dmg \
            --prerelease --target "$GITHUB_SHA" --title "LiveCore Studio 0.7.0 build ${GITHUB_RUN_NUMBER} (unsigned, ${GITHUB_REF_NAME})" \
            --notes "Automated CI build from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Unsigned and not notarized: right-click the app and choose Open the first time. New features are compiled and unit-tested but need hardware verification; see docs/TEST_PLAN.md (T-35 onwards for 0.7.0: MIDI control, music input, minimizable docks)."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/*.log
